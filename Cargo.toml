[package]
name = "asa"
version = "1.7.1"
edition = "2021"
description = "ASA - 去中心化 TUI 群聊工具"
license = "MIT"

[lib]
name = "asa"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "asa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.28"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
hmac = "0.12"
if-addrs = "0.15"
mdns-sd = "0.21"
pbkdf2 = "0.12"
rand = "0.8"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
    "fs",
] }
unicode-width = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
